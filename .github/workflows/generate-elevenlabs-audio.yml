name: Generate ElevenLabs audio

# After ELEVENLABS_API_KEY is a real sk_ key, run Actions → Generate ElevenLabs audio → Run workflow.
# Existing non-empty files under assets/audio/ are skipped so a catalog cache-bust does not
# regenerate or spend quota. New spoken lines still generate because they have no file yet.
# To overwrite every clip, run workflow_dispatch with FORCE_REGENERATE=1.
on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: 'Set to 1 to overwrite existing audio files (FORCE_REGENERATE=1).'
        required: false
        default: '0'
  push:
    branches: [main]
    paths:
      - 'src/audio-catalog.js'
      - 'scripts/generate-elevenlabs-audio.mjs'
      - '.github/workflows/generate-elevenlabs-audio.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip when the secret is missing
        id: secret
        run: |
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "ELEVENLABS_API_KEY is not set on this repository. Skipping generation."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate sampled audio
        if: steps.secret.outputs.missing == 'false'
        env:
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate == '1' && '1' || '0' }}
        run: node scripts/generate-elevenlabs-audio.mjs

      - name: Upload audio artifacts
        if: steps.secret.outputs.missing == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: orbitbreak-elevenlabs-audio
          path: assets/audio
          if-no-files-found: warn

      - name: Open asset PR
        if: steps.secret.outputs.missing == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B audio/elevenlabs-assets
          git add assets/audio
          if git diff --cached --quiet; then
            echo "No audio files changed."
            exit 0
          fi
          git commit -m "Add generated ElevenLabs voice, SFX and music assets."
          git push -u origin audio/elevenlabs-assets --force
          if gh pr list --head audio/elevenlabs-assets --state open --json number --jq 'length' | grep -q '[1-9]'; then
            echo "Asset PR already open."
            exit 0
          fi
          gh pr create --base main --head audio/elevenlabs-assets \
            --title "Add generated ElevenLabs audio assets" \
            --body "Sampled voice, SFX and music generated by the ElevenLabs workflow from the repository secret. The playable game only loads committed files under assets/audio/."
