name: Generate ElevenLabs audio

# This workflow is deliberately manual because generation may spend quota.
# The API secret exists only in the read-only generation step. A separate job
# receives the artifact and may open a reviewable pull request.
on:
  workflow_dispatch:
    inputs:
      generation_scope:
        description: Generate only the reviewed Warden voice, or the full catalog.
        required: true
        type: choice
        options:
          - warden
          - all
        default: warden
      warden_voice_id:
        description: Reviewed ORBITBREAK Warden Voice Design id.
        required: true
        type: string
      force_regenerate:
        description: Overwrite existing files inside the selected scope.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: elevenlabs-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_ready: ${{ steps.generate.outputs.artifact_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Generate sampled audio
        id: generate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate && '1' || '0' }}
          WARDEN_VOICE_ID: ${{ inputs.warden_voice_id }}
        run: |
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "ELEVENLABS_API_KEY is not configured." >&2
            exit 1
          fi
          node scripts/generate-elevenlabs-audio.mjs --scope=${{ inputs.generation_scope }}
          node scripts/master-warden-audio.mjs
          echo "artifact_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated audio
        if: steps.generate.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orbitbreak-elevenlabs-audio
          path: assets/audio
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    if: needs.generate.outputs.artifact_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download generated audio
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orbitbreak-elevenlabs-audio
          path: assets/audio

      - name: Open asset PR
        env:
          ASSET_BRANCH: audio/elevenlabs-assets-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ASSET_BRANCH"
          git add -- assets/audio
          if git diff --cached --quiet; then
            echo "No audio files changed."
            exit 0
          fi
          git commit -m "Add generated ElevenLabs audio assets"
          git push --set-upstream origin "$ASSET_BRANCH"
          gh pr create --base main --head "$ASSET_BRANCH" \
            --title "Add generated ElevenLabs audio assets" \
            --body "Sampled voice, SFX and music generated by the manually approved ElevenLabs workflow. The API secret was available only to the read-only generation job; this publishing job received only the generated artifact."
