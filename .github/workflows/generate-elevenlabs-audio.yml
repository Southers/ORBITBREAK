name: Generate ElevenLabs audio

# This workflow is deliberately manual because generation may spend quota.
# The API secret exists only in the read-only generation step. A separate job
# receives the artifact and may open a reviewable pull request.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Create auditions, save a reviewed candidate, or generate production assets.
        required: true
        type: choice
        options:
          - audition
          - select
          - production
        default: audition
      approve_quota_spend:
        description: Confirm this run may spend ElevenLabs quota.
        required: true
        type: boolean
        default: false
      generation_scope:
        description: Generate only the reviewed Warden voice, or the full catalog.
        required: true
        type: choice
        options:
          - warden
          - all
        default: warden
      warden_voice_id:
        description: Reviewed ORBITBREAK Warden Voice Design id.
        required: false
        type: string
      audition_run_id:
        description: Audition run containing the reviewed candidate manifest.
        required: false
        type: string
      generated_voice_id:
        description: Manifest-listed generated voice id selected by the user.
        required: false
        type: string
      force_regenerate:
        description: Overwrite existing files inside the selected scope.
        required: false
        type: boolean
        default: false
      open_asset_pr:
        description: Open a pull request containing generated production assets.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: elevenlabs-audio
  cancel-in-progress: false

jobs:
  generate:
    if: inputs.approve_quota_spend == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    permissions:
      actions: read
      contents: read
    outputs:
      production_ready: ${{ steps.generate_production.outputs.production_ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Generate review-only Warden auditions
        if: inputs.operation == 'audition'
        run: |
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "ELEVENLABS_API_KEY is not configured." >&2
            exit 1
          fi
          npm run audio:audition:warden

      - name: Upload Warden auditions
        if: inputs.operation == 'audition'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbitbreak-warden-auditions-${{ github.run_id }}
          path: artifacts/warden-auditions
          if-no-files-found: error
          retention-days: 7

      - name: Download reviewed Warden audition
        if: inputs.operation == 'select'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orbitbreak-warden-auditions-${{ inputs.audition_run_id }}
          path: artifacts/warden-auditions
          github-token: ${{ github.token }}
          run-id: ${{ inputs.audition_run_id }}

      - name: Save manifest-listed Warden selection
        if: inputs.operation == 'select'
        env:
          SELECTED_GENERATED_VOICE_ID: ${{ inputs.generated_voice_id }}
        run: |
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "ELEVENLABS_API_KEY is not configured." >&2
            exit 1
          fi
          if [ -z "${SELECTED_GENERATED_VOICE_ID}" ]; then
            echo "A generated voice id is required for selection." >&2
            exit 1
          fi
          node scripts/audition-warden-voice.mjs "--select=${SELECTED_GENERATED_VOICE_ID}"

      - name: Upload selected Warden voice id
        if: inputs.operation == 'select'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbitbreak-selected-warden-voice-${{ github.run_id }}
          path: artifacts/warden-auditions/selected-voice.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate sampled production audio
        if: inputs.operation == 'production'
        id: generate_production
        env:
          FORCE_REGENERATE: ${{ inputs.force_regenerate && '1' || '0' }}
          WARDEN_VOICE_ID: ${{ inputs.warden_voice_id }}
        run: |
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "ELEVENLABS_API_KEY is not configured." >&2
            exit 1
          fi
          node scripts/generate-elevenlabs-audio.mjs --scope=${{ inputs.generation_scope }}
          node scripts/master-warden-audio.mjs
          echo "production_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated production audio
        if: steps.generate_production.outputs.production_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbitbreak-elevenlabs-audio
          path: assets/audio
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: generate
    if: inputs.open_asset_pr == true && needs.generate.outputs.production_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download generated audio
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orbitbreak-elevenlabs-audio
          path: assets/audio

      - name: Open asset PR
        env:
          ASSET_BRANCH: audio/elevenlabs-assets-${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ASSET_BRANCH"
          git add -- assets/audio
          if git diff --cached --quiet; then
            echo "No audio files changed."
            exit 0
          fi
          git commit -m "Add generated ElevenLabs audio assets"
          git push --set-upstream origin "$ASSET_BRANCH"
          gh pr create --base main --head "$ASSET_BRANCH" \
            --title "Add generated ElevenLabs audio assets" \
            --body "Sampled voice, SFX and music generated by the manually approved ElevenLabs workflow. The API secret was available only to the read-only generation job; this publishing job received only the generated artifact."
