name: Save Selected Warden Voice

on:
  workflow_dispatch:
    inputs:
      audition_run_id:
        description: Run id of the reviewed Audition Warden Voice artifact.
        required: true
        type: string
      generated_voice_id:
        description: Manifest-listed generated voice id selected by the user.
        required: true
        type: string
      confirm_selection:
        description: Save this reviewed candidate to the ElevenLabs voice library.
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: select-warden-voice
  cancel-in-progress: false

jobs:
  select:
    if: inputs.confirm_selection == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download reviewed audition
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: orbitbreak-warden-auditions-${{ inputs.audition_run_id }}
          path: artifacts/warden-auditions
          github-token: ${{ github.token }}
          run-id: ${{ inputs.audition_run_id }}

      - name: Save manifest-listed selection
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SELECTED_GENERATED_VOICE_ID: ${{ inputs.generated_voice_id }}
        run: |
          if [ -z "${ELEVENLABS_API_KEY}" ]; then
            echo "ELEVENLABS_API_KEY is not configured." >&2
            exit 1
          fi
          node scripts/audition-warden-voice.mjs "--select=${SELECTED_GENERATED_VOICE_ID}"

      - name: Upload selected voice id
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbitbreak-selected-warden-voice-${{ github.run_id }}
          path: artifacts/warden-auditions/selected-voice.json
          if-no-files-found: error
          retention-days: 7
