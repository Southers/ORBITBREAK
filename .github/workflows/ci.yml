name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run release:audit
      - run: npm run leaderboard:benchmark

  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest already has Google Chrome. Skip `playwright install
      # --with-deps`, which has been hanging indefinitely on GitHub runners.
      - run: npm run test:boot
        env:
          PLAYWRIGHT_CHROME_CHANNEL: chrome
